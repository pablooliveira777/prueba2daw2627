# =============================================================================
# PERFIL TEMPORAL "demo-b8" -> MODO DEMOSTRACION CON H2 EN MEMORIA
# -----------------------------------------------------------------------------
# Motivo: Docker/WSL no esta disponible en este equipo, por lo que las bases
# MariaDB de docker-compose.yml (app_b8 en el puerto 3308) no pueden arrancar.
#
# Este perfil SOLO se usa para la demostracion local y NO MODIFICA ni sustituye
# la configuracion MariaDB de application.properties ni de application-b8.properties.
#
# Se activa con: --spring.profiles.active=demo-b8
# =============================================================================
server.port=8082

spring.datasource.url=jdbc:h2:mem:app_b8;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway se hereda de application.properties
# (spring.flyway.enabled, spring.flyway.locations, spring.flyway.baseline-on-migrate)
# y se ejecuta contra la base H2 "app_b8".
